
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - Toko Buku Online</title>
    <link rel="stylesheet" href="CSS/style.css">
    <script src="JS/data.js" defer></script>
    <script src="JS/script.js" defer></script>
</head>
<body>

    <main class="dashboard-container">

        <header class="dashboard-header">
            <h1>Checkout Buku</h1>
            <button onclick="window.location.href='dashboard.html'">
                Kembali
            </button>
        </header>

        <section class="welcome-section">
            <h2>Pemesanan Buku</h2>
            <p>Silakan pilih buku dan isi data pemesanan kamu.</p>
        </section>

        <section class="checkout-container">

            <form id="formCheckout">

                <div class="form-group">
                    <label for="pilihBuku">Pilih Buku</label>
                    <select id="pilihBuku" required>
                        <option value="">-- Pilih Buku --</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="jumlahBuku">Jumlah Buku</label>
                    <input type="number" id="jumlahBuku"
                        min="1" value="1" required>
                </div>

                <div class="form-group">
                    <label for="namaPemesan">Nama Pemesan</label>
                    <input type="text" id="namaPemesan"
                        placeholder="Masukkan nama" required>
                </div>

                <div class="form-group">
                    <label for="alamatPemesan">Alamat Pengiriman</label>
                    <textarea id="alamatPemesan"
                        placeholder="Masukkan alamat lengkap"
                        rows="4" required></textarea>
                </div>

                <div class="form-group">
                    <label for="teleponPemesan">Nomor Telepon</label>
                    <input type="tel" id="teleponPemesan"
                        placeholder="Masukkan nomor telepon" required>
                </div>

                <div class="total-pesanan">
                    <h3>Total Pembayaran</h3>
                    <p id="totalHarga">Rp 0</p>
                </div>

                <button type="submit" class="btn-login">
                    Buat Pesanan
                </button>

            </form>

        </section>

    </main>

</body>
</html>
