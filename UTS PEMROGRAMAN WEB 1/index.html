
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Toko Buku Online</title>
    <link rel="stylesheet" href="CSS/style.css">
    <script src="JS/data.js" defer></script>
    <script src="JS/script.js" defer></script>
</head>
<body>

    <main class="login-container">
        <section class="login-box">
            <h1>Toko Buku Online</h1>
            <p class="subtitle">Selamat datang! Silakan login untuk melanjutkan.</p>

            <form onsubmit="prosesLogin(event)">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email"
                        placeholder="Masukkan email" required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password"
                        placeholder="Masukkan password" required>
                </div>

                <button type="submit" class="btn-login">Login</button>
            </form>

            <div class="login-links">
                <button type="button" onclick="alert('Silakan hubungi admin untuk bantuan reset password.')">
                    Lupa Password?
                </button>
                <button type="button" onclick="alert('Fitur pendaftaran akan segera tersedia.')">
                    Daftar
                </button>
            </div>
        </section>
    </main>

</body>
</html>
